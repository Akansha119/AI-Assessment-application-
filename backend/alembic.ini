# AssessIQ Alembic configuration
[alembic]
# path to migration scripts
script_location = migrations

# database URL (overridden by env DATABASE_URL at runtime)
sqlalchemy.url = driver://user:pass@localhost/dbname

# version location
version_locations = %(here)s/versions

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# version directory separator
# version_path_separator = os

# the encoding used to save migration files
file_encoding = utf-8

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html#post-write-hooks

# hooks run in the order specified
# hooks = my_hook black

# my_hook = mypackage.my_module:my_function
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
